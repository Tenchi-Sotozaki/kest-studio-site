<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KestStudio | Films & Visual Storytelling</title>

    <!-- SEO 基本 -->
    <meta name="description" content="KestStudioは、映像でブランドの本質を可視化するクリエイティブスタジオです。" />
    <meta name="theme-color" content="#f7f4ef" />
    <link rel="canonical" href="/" />

    <!-- ▼▼ 独自ドメイン公開後、この行の URL を実際のドメインに差し替えてください ▼▼
         例) <meta property="og:url" content="https://keststudio.com/" />
             <meta property="og:image" content="https://keststudio.com/og-image.jpg" />
         ※ og:image は絶対URLでないとSNS側でサムネが出ない場合があります ▲▲ -->
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/og-image.jpg" />

    <!-- OGP -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kest Studio" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:title" content="Kest Studio | Films & Visual Storytelling" />
    <meta property="og:description" content="KestStudioは、映像でブランドの本質を可視化するクリエイティブスタジオです。" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kest Studio — Journey to Inspiration, Driven by Our Films." />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kest Studio | Films & Visual Storytelling" />
    <meta name="twitter:description" content="KestStudioは、映像でブランドの本質を可視化するクリエイティブスタジオです。" />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Fonts（Vue 側の Playfair に合わせる）
         ※ Helvetica Neue は Google Fonts に存在しないため指定から除外（OS標準／フォールバックを使用） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Base Style -->
    <style>
      /* ===== Reset ===== */
      *, *::before, *::after {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }

      body {
        font-family: 'Helvetica Neue', Arial, sans-serif;
        background-color: #f7f4ef;
        color: #0c0c0c;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      ::selection {
        background: rgba(0, 0, 0, 0.12);
      }

      /* ===== App Root ===== */
      #app {
        min-height: 100vh;
      }

      /* ===== Initial Loading (Vue mount 前) ===== */
      .app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f4ef;
        z-index: 9999;
        font-family: 'Playfair Display', serif;
        letter-spacing: 0.05em;
        font-size: 14px;
        color: #0c0c0c;
        opacity: 1;
        transition: opacity 0.6s ease;
      }

      .app-loading.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <!-- Vue マウント前の静かなローディング -->
    <div class="app-loading" id="app-loading">
      KEST STUDIO
    </div>

<form name="contact" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="name" />
    <input type="email" name="email" />
    <textarea name="message"></textarea>
  </form>

  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>

    <!-- Vue 起動後にローディングを消す -->
    <script>
      window.addEventListener('load', () => {
        const loader = document.getElementById('app-loading');
        if (loader) {
          loader.classList.add('is-hidden');
          setTimeout(() => loader.remove(), 800);
        }
      });
    </script>
  </body>
</html>
